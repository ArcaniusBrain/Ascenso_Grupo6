          type: integer
          minimum: 1
        registradoEnUtc:
          type: string
          format: date-time
    CostoMatriculaPeriodoResponse:
      type: object
      additionalProperties: false
      required:
      - universidadId
      - codigoPeriodo
      - historial
      properties:
        universidadId:
          $ref: '#/components/schemas/Id'
        codigoPeriodo:
          $ref: '#/components/schemas/CodigoPeriodo'
        costoVigente:
          oneOf:
          - $ref: '#/components/schemas/CostoMatriculaRegistroDto'
          - type: 'null'
        mensaje:
          type:
          - string
          - 'null'
        historial:
          type: array
          items:
            $ref: '#/components/schemas/CostoMatriculaRegistroDto'
    InicioInscripcionesUniversidadResponse:
      type: object
      additionalProperties: false
      required:
      - universidadId
      - codigoPeriodo
      - inscripcionesIniciadas
      properties:
        universidadId:
          $ref: '#/components/schemas/Id'
        codigoPeriodo:
          $ref: '#/components/schemas/CodigoPeriodo'
        fechaInicio:
          type:
          - string
          - 'null'
          format: date
        inscripcionesIniciadas:
          type: boolean
        mensaje:
          type:
          - string
          - 'null'
    UniversidadResumenDto:
      type: object
      additionalProperties: false
      required:
      - id
      - nombre
      - terminosConvenio
      - viaDatosAcademicos
      - contactoDesignado
      - version
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nombre:
          type: string
        terminosConvenio:
          type: string
        viaDatosAcademicos:
          $ref: '#/components/schemas/ViaDatosAcademicos'
        contactoDesignado:
          $ref: '#/components/schemas/ContactoDesignadoDto'
        version:
          type: integer
          minimum: 0
    UniversidadDetalleResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - nombre
      - terminosConvenio
      - viaDatosAcademicos
      - contactoDesignado
      - version
      - carreras
      - costosVigentes
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nombre:
          type: string
        terminosConvenio:
          type: string
        viaDatosAcademicos:
          $ref: '#/components/schemas/ViaDatosAcademicos'
        contactoDesignado:
          $ref: '#/components/schemas/ContactoDesignadoDto'
        version:
