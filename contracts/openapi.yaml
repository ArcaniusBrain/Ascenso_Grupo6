          type:
          - string
          - 'null'
        carreras:
          type: array
          items:
            $ref: '#/components/schemas/CarreraElegibleDto'
        costosVigentes:
          type: array
          items:
            $ref: '#/components/schemas/CostoMatriculaRegistroDto'
    AceptarOfertaCommand:
      type: object
      additionalProperties: false
      required:
      - operationId
      properties:
        operationId:
          $ref: '#/components/schemas/Id'
      description: HU-16.1; la identidad del becario se obtiene del token, y la oferta desde la ruta.
    MarcarIncidenciaDesembolsoCommand:
      type: object
      additionalProperties: false
      required:
      - tipo
      - operationId
      properties:
        tipo:
          type: string
          enum:
          - FALLIDO
          - DEVUELTO
        operationId:
          $ref: '#/components/schemas/Id'
      description: 'HU-20.2: conservar actor y fecha de la marca original, sin duplicarla.'
    ResolverDesembolsoCommand:
      type: object
      additionalProperties: false
      required:
      - descripcionResolucion
      - fechaNuevoPago
      - metodoNuevoPago
      - destinatario
      - otp
      - operationId
      properties:
        descripcionResolucion:
          type: string
          minLength: 3
        fechaNuevoPago:
          type: string
          format: date
        metodoNuevoPago:
          type: string
          minLength: 2
        destinatario:
          type: string
          minLength: 2
        otp:
          $ref: '#/components/schemas/OtpDeOperacion'
        operationId:
          $ref: '#/components/schemas/Id'
      description: 'HU-20.2: nuevo pago para desembolso fallido/devuelto, límites por periodo y OTP RESOLVER_PAGO.'
    IncidenciaRegistradaRespuesta:
      type: object
      additionalProperties: false
      required:
      - desembolsoId
      - estado
      - operationId
      properties:
        desembolsoId:
          $ref: '#/components/schemas/Id'
        estado:
          type: string
          enum:
          - FALLIDO
          - DEVUELTO
        operationId:
          $ref: '#/components/schemas/Id'
    DesembolsoResueltoRespuesta:
      type: object
      additionalProperties: false
      required:
      - desembolsoId
      - estado
      - operationId
      properties:
        desembolsoId:
          $ref: '#/components/schemas/Id'
        estado:
          type: string
          enum:
          - PAGADO
        operationId:
          $ref: '#/components/schemas/Id'
    ResultadoLote:
      type: object
      additionalProperties: false
      description: Resultado del envío por fila (HU-24.3, paso 7). Mientras el estado no sea PROCESADO, resultados
        puede venir incompleto.
      required:
      - loteId
      - estado
      - recibidos
      - registrados
      - rechazados
      - resultados
      properties:
        loteId:
          $ref: '#/components/schemas/Id'
        estado:
          type: string
          enum:
          - ACEPTADO
          - EN_PROCESO
          - PROCESADO
        recibidos:
          type: integer
          minimum: 0
        registrados:
          type: integer
          minimum: 0
        rechazados:
          type: integer
          minimum: 0
        resultados:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - codigoEstudiante
            - resultado
            properties:
              codigoEstudiante:
                type: string
                minLength: 1
              resultado:
                type: string
                enum:
                - REGISTRADO
                - RECHAZADO
              motivo:
                type: string
                description: Obligatorio cuando resultado es RECHAZADO.
              tardio:
                type: boolean
                description: Recibido después de la fecha límite del periodo (UTC-4, HU-24.1).
paths:
  /api/v1/tipos-usuario:
    get:
      tags:
      - S1
