        '401':
          description: Error estructurado RFC 9457
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Error estructurado RFC 9457
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
      - S1
      summary: Crear usuario interno, evaluador externo o enlace universitario (solo Dirección, HU-37.1)
      operationId: S1postapiv1usuarios
      security:
      - BearerAuth: []
