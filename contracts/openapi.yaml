      operationId: S1getapiv1tiposusuario
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Catálogo configurable de tipos de usuario
        '401':
          description: Error estructurado RFC 9457
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
      - S1
      summary: Crear nuevo tipo de usuario con permisos (solo Dirección, HU-37.1)
      operationId: S1postapiv1tiposusuario
      security:
      - BearerAuth: []
      responses:
        '201':
          description: Tipo de usuario creado con marca automática de 2FA si accede a datos financieros o de decisión
        '401':
          description: Error estructurado RFC 9457
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Error estructurado RFC 9457
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Nombre de tipo de usuario duplicado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Regla de negocio incumplida (ej. nombre vacío)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/usuarios:
