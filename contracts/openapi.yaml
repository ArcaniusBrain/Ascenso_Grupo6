openapi: 3.1.0
info:
  title: ASCENSO - API pública v1.3 (YARP, sin rutas internas)
  version: 1.3.0
  description: API pública para usuarios, universidades y consultas. Las reservas, su liberación, validación/consumo
    de OTP y consultas autoritativas entre servicios están SOLO en openapi-interno.yaml, fuera del Gateway. Contratos
    de diseño (sin implementación).
servers:
- url: https://ascenso.example.invalid
  description: URL documental, no desplegada
tags:
- name: S1
- name: S2
- name: S3
- name: S4
- name: S5
- name: S6
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Id:
      type: string
      format: uuid
    CodigoPeriodo:
      type: string
      example: 2026-2
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlationId:
          type: string
          format: uuid
      required:
      - title
      - status
      - correlationId
      additionalProperties: false
    ChallengeRequest:
      type: object
      required:
      - operacion
      - resourceId
      - canal
      properties:
        operacion:
          type: string
          enum:
          - CONFIRMAR_PAGO
          - REVOCAR_BECA
          - MODIFICAR_DATOS_PAGO
          - RESOLVER_PAGO
          - APLICAR_CONSECUENCIA_REVOCATORIA
        resourceId:
          $ref: '#/components/schemas/Id'
        canal:
          type: string
          enum:
          - CORREO
          - SMS
    ChallengeResponse:
      type: object
      required:
      - challengeId
      - expiraEnUtc
      properties:
        challengeId:
          $ref: '#/components/schemas/Id'
        expiraEnUtc:
          type: string
          format: date-time
      additionalProperties: false
    OfertaRequest:
      type: object
      properties:
        postulacionId:
          $ref: '#/components/schemas/Id'
        fechaLimite:
          type: string
          format: date
        operationId:
          $ref: '#/components/schemas/Id'
      required:
      - postulacionId
      - fechaLimite
      - operationId
      description: El servidor S4 obtiene selección válida de S3, programa y ciclo por proyección certificada y
        S2 calcula monto/cupos según C1. El navegador nunca envía PlanReserva.
    PagoRequest:
      type: object
      required:
      - desembolsoId
      - otp
      - operationId
      properties:
        desembolsoId:
          $ref: '#/components/schemas/Id'
        operationId:
          $ref: '#/components/schemas/Id'
        otp:
          $ref: '#/components/schemas/OtpDeOperacion'
    RevocacionRequest:
      type: object
      required:
      - justificacion
      - otp
      - operationId
      properties:
        justificacion:
          type: string
          minLength: 3
        operationId:
          $ref: '#/components/schemas/Id'
        otp:
          $ref: '#/components/schemas/OtpDeOperacion'
    PostulacionRequest:
      type: object
      required:
      - cicloId
      properties:
        cicloId:
          $ref: '#/components/schemas/Id'
        documentos:
          type: array
          items:
            type: string
      description: El postulante se deriva exclusivamente del token autenticado.
    EvaluacionRequest:
      type: object
      required:
      - rubricaAplicadaId
      - puntuaciones
      properties:
        rubricaAplicadaId:
          $ref: '#/components/schemas/Id'
        puntuaciones:
          type: array
          items:
            type: object
            properties:
              criterioId:
                $ref: '#/components/schemas/Id'
              puntos:
                type: number
      description: El evaluador se deriva del token y se verifican asignación vigente y conflicto de interés.
    ReporteAcademicoLote:
      type: object
      required:
      - codigoPeriodo
      - loteId
      - reportes
      properties:
        codigoPeriodo:
          type: string
        loteId:
          $ref: '#/components/schemas/Id'
        reportes:
          type: array
          items:
            type: object
            properties:
              codigoEstudiante:
                type: string
                minLength: 1
                description: Identificador de la universidad; ACL lo resuelve a becaId interno.
              promedio:
                type: number
              materiasAprobadas:
                type: integer
                minimum: 0
              materiasReprobadas:
                type: integer
                minimum: 0
              estadoMatricula:
                type: string
                minLength: 1
                description: Texto libre enviado por la universidad (R37/A7). S5 conserva el texto original y lo clasifica internamente en EstadoMatricula (INSCRITO, RETIRADO, CONGELADO, EGRESADO o NO_RECONOCIDO, según ADR-29 / C10).
            required:
            - codigoEstudiante
            - promedio
            - materiasAprobadas
            - materiasReprobadas
            - estadoMatricula
            additionalProperties: false
          minItems: 1
      description: El cliente universitario obtiene token mediante Keycloak client_credentials; la universidad se
        obtiene de las claims, no solo de la URL.
    ConsultaResponse:
      type: object
      properties:
        actualizadoEnUtc:
          type: string
          format: date-time
        datos:
          type: object
          additionalProperties: true
    OtpDeOperacion:
      type: object
      additionalProperties: false
      required:
      - challengeId
      - codigo
      properties:
        challengeId:
          $ref: '#/components/schemas/Id'
        codigo:
          type: string
          pattern: ^[0-9]{6,8}$
          description: Longitud exacta fijada al implementarse; servidor valida R4.
    OperacionConfirmada:
      type: object
      additionalProperties: false
      required:
      - id
      - estado
      - correlationId
      properties:
        id:
          $ref: '#/components/schemas/Id'
        estado:
          type: string
        correlationId:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          minimum: 0
    PostulacionCreada:
      type: object
      additionalProperties: false
      required:
      - postulacionId
      - estado
      properties:
        postulacionId:
          $ref: '#/components/schemas/Id'
        estado:
          type: string
          enum:
          - RECIBIDA
    OfertaEmitidaRespuesta:
      type: object
      additionalProperties: false
      required:
      - ofertaId
      - reservaId
      - estado
      properties:
        ofertaId:
          $ref: '#/components/schemas/Id'
        reservaId:
          $ref: '#/components/schemas/Id'
        estado:
          type: string
          enum:
          - PENDIENTE
    PagoConfirmadoRespuesta:
      type: object
      additionalProperties: false
      required:
      - pagoId
      - desembolsoId
      - estado
      properties:
        pagoId:
          $ref: '#/components/schemas/Id'
        desembolsoId:
          $ref: '#/components/schemas/Id'
        estado:
          type: string
          enum:
          - CONFIRMADO
    LoteAceptado:
      type: object
      additionalProperties: false
      required:
      - loteId
      - estado
      - recibidos
      properties:
        loteId:
          $ref: '#/components/schemas/Id'
        estado:
          type: string
          enum:
          - ACEPTADO
        recibidos:
          type: integer
          minimum: 0
    Indicadores:
      type: object
      required:
      - actualizadoEnUtc
      - indicadores
      properties:
        actualizadoEnUtc:
          type: string
          format: date-time
        indicadores:
          type: object
          additionalProperties:
            type: number
    ConsultaRegistrada:
      type: object
      required:
      - consultaId
      - estado
      properties:
        consultaId:
          $ref: '#/components/schemas/Id'
        estado:
          type: string
          enum:
          - ABIERTA
    PublicarCicloCommand:
      type: object
      required:
      - fechaPublicacion
      properties:
        fechaPublicacion:
          type: string
          format: date-time
    AbrirEvaluacionCommand:
      type: object
      required:
      - cierreRevision
      properties:
        cierreRevision:
          type: string
          format: date-time
    CrearProgramaCommand:
      type: object
      additionalProperties: false
      required:
      - nombre
      - periodoInicio
      - cupoBecarios
      - duracionPeriodos
      - montoPorPeriodo
      - modalidadPago
      - alcance
      properties:
        nombre:
          type: string
          minLength: 2
        periodoInicio:
          $ref: '#/components/schemas/CodigoPeriodo'
        cupoBecarios:
          type: integer
          minimum: 1
        duracionPeriodos:
          type: integer
          minimum: 1
        montoPorPeriodo:
          type: number
          exclusiveMinimum: 0
        moneda:
          type:
          - string
          - 'null'
          default: USD
        modalidadPago:
          type: string
          enum:
          - MENSUAL
          - SEMESTRAL
          - DIRECTO_UNIVERSIDAD
        alcance:
          type: string
          enum:
          - COMPLETO
          - PARCIAL
        permiteAcumulacion:
          type: boolean
          default: false
    ActualizarConfiguracionProgramaCommand:
      type: object
      additionalProperties: false
      required:
      - nombre
      - montoPorPeriodo
      - modalidadPago
      - alcance
      properties:
        nombre:
          type: string
          minLength: 2
        montoPorPeriodo:
          type: number
          exclusiveMinimum: 0
        moneda:
          type:
          - string
          - 'null'
          default: USD
        modalidadPago:
          type: string
          enum:
          - MENSUAL
          - SEMESTRAL
          - DIRECTO_UNIVERSIDAD
        alcance:
          type: string
          enum:
          - COMPLETO
          - PARCIAL
        permiteAcumulacion:
          type: boolean
          default: false
    AsociarDonanteProgramaCommand:
      type: object
      additionalProperties: false
      required:
      - donanteId
      properties:
        donanteId:
          $ref: '#/components/schemas/Id'
    RestriccionUniversidadItemCommand:
      type: object
      additionalProperties: false
      required:
      - universidadId
      properties:
        universidadId:
          $ref: '#/components/schemas/Id'
        carreras:
          type: array
          items:
            type: string
    ConfigurarElegibilidadProgramaCommand:
      type: object
      additionalProperties: false
      properties:
        restricciones:
          type: array
          items:
            $ref: '#/components/schemas/RestriccionUniversidadItemCommand'
    ConfigurarCondicionesProgramaCommand:
      type: object
      additionalProperties: false
      required:
      - promedioMinimo
      - exigeHorasServicio
      properties:
        promedioMinimo:
          type:
          - string
          - number
          description: Acepta valor numérico no negativo; valores no numéricos devuelven 422 con mensaje literal HU-11.2 E7.
        exigeHorasServicio:
          type: boolean
        horasServicio:
          type:
          - integer
          - 'null'
        reportesExigidos:
          type: array
          items:
            type: string
        duracionMaxPausaMeses:
          type:
          - integer
          - 'null'
        descripcionRenovacion:
          type:
          - string
          - 'null'
    DonanteAporteResumenDto:
      type: object
      additionalProperties: false
      required:
      - donanteId
      - nombreDonante
      - totalAportado
      - moneda
      properties:
        donanteId:
          $ref: '#/components/schemas/Id'
        nombreDonante:
          type: string
        totalAportado:
          type: number
        moneda:
          type: string
        leyendaSinAportes:
          type:
          - string
          - 'null'
    RestriccionElegibilidadDto:
      type: object
      additionalProperties: false
      required:
      - universidadId
      - nombreUniversidad
      - carreras
      properties:
        universidadId:
          $ref: '#/components/schemas/Id'
        nombreUniversidad:
          type: string
        carreras:
          type: array
          items:
            type: string
        avisoSinCarreras:
          type:
          - string
          - 'null'
    CondicionesPermanenciaDto:
      type: object
      additionalProperties: false
      required:
      - promedioMinimo
      - exigeHorasServicio
      - leyendaHorasServicio
      - reportesExigidos
      - duracionMaxPausaMeses
      - descripcionRenovacion
      properties:
        promedioMinimo:
          type: number
        exigeHorasServicio:
          type: boolean
        horasServicio:
          type:
          - integer
          - 'null'
        leyendaHorasServicio:
          type: string
        reportesExigidos:
          type: array
          items:
            type: string
        duracionMaxPausaMeses:
          type: integer
        descripcionRenovacion:
          type: string
    ProgramaResumenDto:
      type: object
      additionalProperties: false
      required:
      - id
      - nombre
      - periodoInicio
      - cupoBecarios
      - duracionPeriodos
      - montoPorPeriodo
      - moneda
      - modalidadPago
      - alcance
      - permiteAcumulacion
      - version
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nombre:
          type: string
        periodoInicio:
          $ref: '#/components/schemas/CodigoPeriodo'
        cupoBecarios:
          type: integer
        duracionPeriodos:
          type: integer
        montoPorPeriodo:
          type: number
        moneda:
          type: string
        modalidadPago:
          type: string
        alcance:
          type: string
        permiteAcumulacion:
          type: boolean
        version:
          type: integer
    ProgramaDetalleResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - nombre
      - periodoInicio
      - cupoBecarios
      - duracionPeriodos
      - montoPorPeriodo
      - moneda
      - modalidadPago
      - alcance
      - permiteAcumulacion
      - presupuestoTotal
      - donantes
      - restricciones
      - version
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nombre:
          type: string
        periodoInicio:
          $ref: '#/components/schemas/CodigoPeriodo'
        cupoBecarios:
          type: integer
        duracionPeriodos:
          type: integer
        montoPorPeriodo:
          type: number
        moneda:
          type: string
        modalidadPago:
          type: string
        alcance:
          type: string
        permiteAcumulacion:
          type: boolean
        presupuestoTotal:
          type: number
        donantes:
          type: array
          items:
            $ref: '#/components/schemas/DonanteAporteResumenDto'
        leyendaElegibilidad:
          type:
          - string
          - 'null'
        restricciones:
          type: array
          items:
            $ref: '#/components/schemas/RestriccionElegibilidadDto'
        condiciones:
          oneOf:
          - $ref: '#/components/schemas/CondicionesPermanenciaDto'
          - type: 'null'
        version:
          type: integer
    RegistrarAporteCommand:
      type: object
      required:
      - donanteId
      - cantidad
      - moneda
      - codigoPeriodo
      properties:
        donanteId:
          $ref: '#/components/schemas/Id'
        cantidad:
          type: number
          exclusiveMinimum: 0
        moneda:
          type: string
          minLength: 3
          maxLength: 3
        codigoPeriodo:
          $ref: '#/components/schemas/CodigoPeriodo'
    SeleccionarCommand:
      type: object
      required:
      - codigoPeriodo
      - correlationId
      properties:
        codigoPeriodo:
          $ref: '#/components/schemas/CodigoPeriodo'
        correlationId:
          $ref: '#/components/schemas/Id'
    JustificarCommand:
      type: object
      required:
      - justificacion
      properties:
        justificacion:
          type: string
          minLength: 3
    RenovarCommand:
      type: object
      required:
      - codigoPeriodo
      properties:
        codigoPeriodo:
          $ref: '#/components/schemas/CodigoPeriodo'
    RegistrarConsultaCommand:
      type: object
      required:
      - asunto
      - mensaje
      properties:
        asunto:
          type: string
          minLength: 3
        mensaje:
          type: string
          minLength: 1
    DatosPagoCommand:
      type: object
      required:
      - destinatario
      - numeroCuenta
      - otp
      - operationId
      properties:
        destinatario:
          type: string
          minLength: 2
        otp:
          $ref: '#/components/schemas/OtpDeOperacion'
        operationId:
          $ref: '#/components/schemas/Id'
        numeroCuenta:
          type: string
          minLength: 4
          description: Se recibe sobre TLS; S4 cifra al persistir mediante su adaptador y jamás incluye el valor
            en logs/respuestas.
    AplicarConsecuenciaCommand:
      type: object
      description: HU-25.2. El servidor solo acepta consecuencias contempladas en la PoliticaConsecuencias vigente
        del programa (422 en caso contrario). La suspensión reutiliza HU-21.1 y la revocación HU-22.1.
      required:
      - evaluacionCumplimientoId
      - consecuencia
      - siguientePaso
      - justificacion
      - operationId
      properties:
        evaluacionCumplimientoId:
          $ref: '#/components/schemas/Id'
        consecuencia:
          type: string
          enum:
          - LLAMADO_ATENCION
          - SUSPENSION
          - REVOCACION
          description: Enumeración Consecuencia del DDD v3.2.
        siguientePaso:
          type: string
          minLength: 3
          description: Texto que el becario verá como siguiente paso (RF-25).
        justificacion:
          type: string
          minLength: 3
        fechaRevision:
          type:
          - string
          - 'null'
          format: date
          description: Solo para SUSPENSION. Nula significa suspensión indefinida (HU-21.1).
        otp:
          allOf:
          - $ref: '#/components/schemas/OtpDeOperacion'
          description: Obligatorio solo cuando consecuencia es REVOCACION (HU-22.1); desafío con operacion APLICAR_CONSECUENCIA_REVOCATORIA.
        operationId:
          $ref: '#/components/schemas/Id'
      allOf:
      - if:
          properties:
            consecuencia:
              const: REVOCACION
          required:
          - consecuencia
        then:
          required:
          - otp
    MarcarPeriodoCommand:
      type: object
      additionalProperties: false
      required:
      - codigoPeriodo
      - operationId
      properties:
        codigoPeriodo:
          $ref: '#/components/schemas/CodigoPeriodo'
        operationId:
          $ref: '#/components/schemas/Id'
      description: HU-38.2; periodo actual decidido en S2, no selección de oferta.
    AbrirPeriodoCommand:
      type: object
      additionalProperties: false
      required:
      - codigoPeriodo
      properties:
        codigoPeriodo:
          $ref: '#/components/schemas/CodigoPeriodo'
      description: HU-38.1; registra un nuevo periodo académico en la secuencia (solo Dirección).
    RegistrarInicioInscripcionesCommand:
      type: object
      additionalProperties: false
      required:
      - universidadId
      - nombreUniversidad
      - fechaInicio
      properties:
        universidadId:
          $ref: '#/components/schemas/Id'
        nombreUniversidad:
          type: string
          minLength: 2
        fechaInicio:
          type: string
          format: date
          description: Fecha de inicio de inscripciones interpretada desde las 00:00 UTC-4 (C4, R20).
      description: HU-38.1 E10–E13; una única fecha por universidad y periodo (solo Dirección).
    InicioInscripcionesDto:
      type: object
      additionalProperties: false
      required:
      - id
      - universidadId
      - nombreUniversidad
      - codigoPeriodo
      - fechaInicio
      - inscripcionesIniciadas
      properties:
        id:
          $ref: '#/components/schemas/Id'
        universidadId:
          $ref: '#/components/schemas/Id'
        nombreUniversidad:
          type: string
        codigoPeriodo:
          $ref: '#/components/schemas/CodigoPeriodo'
        fechaInicio:
          type: string
          format: date
        inscripcionesIniciadas:
          type: boolean
    PeriodoResumenDto:
      type: object
      additionalProperties: false
      required:
      - codigo
      - estado
      - esActual
      - registradoEnUtc
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoPeriodo'
        estado:
          type: string
          enum:
          - ABIERTO
          - CERRADO
        esActual:
          type: boolean
        registradoEnUtc:
          type: string
          format: date-time
    ListaPeriodosResponse:
      type: object
      additionalProperties: false
      required:
      - calendarioId
      - version
      - periodos
      properties:
        calendarioId:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          minimum: 0
        periodoActual:
          type:
          - string
          - 'null'
        mensaje:
          type:
          - string
          - 'null'
        periodos:
          type: array
          items:
            $ref: '#/components/schemas/PeriodoResumenDto'
    PeriodoDetalleResponse:
      type: object
      additionalProperties: false
      required:
      - codigo
      - estado
      - esActual
      - esPeriodoAnterior
      - registradoEnUtc
      - cantidadElementosLigados
      - iniciosInscripciones
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoPeriodo'
        estado:
          type: string
          enum:
          - ABIERTO
          - CERRADO
        esActual:
          type: boolean
        esPeriodoAnterior:
          type: boolean
        registradoEnUtc:
          type: string
          format: date-time
        cantidadElementosLigados:
          type: integer
          minimum: 0
        mensajeSinElementos:
          type:
          - string
          - 'null'
        iniciosInscripciones:
          type: array
          items:
            $ref: '#/components/schemas/InicioInscripcionesDto'
    ViaDatosAcademicos:
      type: string
      enum:
      - API
      - MANUAL
      description: HU-14.1; origen de la información académica según convenio universitario.
    ContactoDesignadoDto:
      type: object
      additionalProperties: false
      required:
      - nombreCompleto
      properties:
        nombreCompleto:
          type: string
          minLength: 2
        correo:
          type:
          - string
          - 'null'
        telefono:
          type:
          - string
          - 'null'
    RegistrarUniversidadCommand:
      type: object
      additionalProperties: false
      required:
      - nombre
      - terminosConvenio
      - viaDatosAcademicos
      - contactoDesignado
      properties:
        nombre:
          type: string
          minLength: 2
        terminosConvenio:
          type: string
          minLength: 3
        viaDatosAcademicos:
          $ref: '#/components/schemas/ViaDatosAcademicos'
        contactoDesignado:
          $ref: '#/components/schemas/ContactoDesignadoDto'
    ActualizarConvenioUniversidadCommand:
      type: object
      additionalProperties: false
      required:
      - nombre
      - terminosConvenio
      - viaDatosAcademicos
      - contactoDesignado
      properties:
        nombre:
          type: string
          minLength: 2
        terminosConvenio:
          type: string
          minLength: 3
        viaDatosAcademicos:
          $ref: '#/components/schemas/ViaDatosAcademicos'
        contactoDesignado:
          $ref: '#/components/schemas/ContactoDesignadoDto'
    AgregarCarreraCommand:
      type: object
      additionalProperties: false
      required:
      - nombre
      properties:
        nombre:
          type: string
          minLength: 2
    RegistrarCostoMatriculaCommand:
      type: object
      additionalProperties: false
      required:
      - codigoPeriodo
      - monto
      properties:
        codigoPeriodo:
          $ref: '#/components/schemas/CodigoPeriodo'
        monto:
          type: number
          exclusiveMinimum: 0
        moneda:
          type:
          - string
          - 'null'
          default: USD
    RegistrarInicioInscripcionesUniversidadCommand:
      type: object
      additionalProperties: false
      required:
      - codigoPeriodo
      - fechaInicio
      properties:
        codigoPeriodo:
