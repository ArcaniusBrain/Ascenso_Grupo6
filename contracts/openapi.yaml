          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/usuarios/{usuarioId}/roles:
    put:
      tags:
      - S1
      summary: Asignar o cambiar roles de usuario con cierre obligatorio de sesiones (solo Dirección, HU-37.1)
      operationId: S1putapiv1usuariosroles
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: usuarioId
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Roles actualizados y sesiones previas revocadas
        '403':
          description: Bloqueo de auto-escalamiento o rol no autorizado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/login:
    post:
      tags:
      - S1
      summary: Iniciar sesión paso 1 (Keycloak) y disparar segundo factor 2FA por correo o SMS (HU-37.2, ADR-09)
      operationId: S1postapiv1authlogin
      responses:
        '200':
          description: Sesión abierta directamente para roles exentos de 2FA
        '202':
          description: Contraseña válida; segundo factor obligatorio enviado (sin emitir token de sesión)
        '401':
          description: Credenciales inválidas
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Bloqueo temporal de 1 hora tras 3 intentos fallidos de 2FA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Fallo al entregar el segundo factor; sesión no abierta
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/2fa/verificar:
    post:
      tags:
      - S1
      summary: Verificar código de segundo factor de un solo uso y abrir sesión (HU-37.2)
      operationId: S1postapiv1auth2faverificar
      responses:
        '200':
          description: Segundo factor verificado y sesión abierta con permisos del rol
        '401':
          description: Código inválido, vencido (> 15 min) o ya usado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Tercer intento fallido; cuenta bloqueada 1 hora para 2FA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/2fa/reenviar:
    post:
      tags:
      - S1
      summary: Reenviar código de segundo factor invalidando el anterior (HU-37.2)
      operationId: S1postapiv1auth2fareenviar
      responses:
        '202':
          description: Nuevo código enviado por el canal del usuario
        '429':
          description: Bloqueo temporal activo de 1 hora
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Fallo del canal de envío
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/2fa/recuperar:
    post:
      tags:
