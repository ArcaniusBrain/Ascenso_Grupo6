name: CI Frontend (Next.js)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  verificar:
    name: Lint, Typecheck, Pruebas y Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Verificación de tipos TypeScript
        run: npm run typecheck

      - name: Pruebas unitarias BFF
        run: npm test

      - name: Build de producción Next.js
        env:
          ASCENSO_SESSION_SECRET: ci-build-placeholder-secret-min-32-chars-ascenso
        run: npm run build
