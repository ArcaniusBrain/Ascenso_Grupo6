name: .NET CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar y probar solución .NET 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore Ascenso.sln

      - name: Compilar solución (warnings como errores)
        run: dotnet build Ascenso.sln --no-restore --configuration Release

      - name: Ejecutar pruebas unitarias y de arquitectura
        run: dotnet test Ascenso.sln --no-build --configuration Release --verbosity normal
